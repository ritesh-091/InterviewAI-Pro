name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'

    # Build and Test Backend Server
    - name: Install Server Dependencies
      run: |
        npm install --prefix server

    - name: Lint Backend Code
      run: |
        # Optional: Add backend lint script to package.json
        echo "Running backend style guidelines checks..."

    # Build and Test React Client
    - name: Install Client Dependencies
      run: |
        npm install --prefix client

    - name: Build Vite Assets
      run: |
        npm run build --prefix client
      env:
        CI: false # Prevent warning compilation flags from crashing builds

    # Verify Docker Images compile successfully
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Server Docker Image (Dry Run)
      uses: docker/build-push-action@v4
      with:
        context: ./server
        file: ./server/Dockerfile
        push: false

    - name: Build Client Docker Image (Dry Run)
      uses: docker/build-push-action@v4
      with:
        context: ./client
        file: ./client/Dockerfile
        push: false

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    # Deploy React Frontend client to Vercel
    - name: Deploy Client to Vercel
      uses: amondnet/vercel-action@v20
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./client
        vercel-args: '--prod'

    # Deploy Express API server to Render
    - name: Trigger Backend Deploy on Render
      run: |
        curl -f "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
