version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: interviewai_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - interviewai_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: interviewai_server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/interviewai_pro
      - JWT_SECRET=super_secret_jwt_key_interviewai_pro_2026
      - JWT_SECRET_REFRESH=super_secret_refresh_key_interviewai_pro_2026
      - CLIENT_URL=http://localhost
    depends_on:
      - mongodb
    networks:
      - interviewai_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: interviewai_client
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - interviewai_network

volumes:
  mongo_data:

networks:
  interviewai_network:
    driver: bridge
